[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lorem-ipsum-generator"
version = "0.1.0"
description = "A Lorem Ipsum placeholder text generator for designers and developers worldwide"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["lorem", "ipsum", "placeholder", "text", "cli", "designer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
lorem = "lorem_generator.cli:main"
lorem-ipsum = "lorem_generator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/lorem-ipsum-generator"
Repository = "https://github.com/Master-626/lorem-ipsum-generator"
Issue-Tracker = "https://github.com/Master-626/lorem-ipsum-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lorem_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["lorem_generator"]
